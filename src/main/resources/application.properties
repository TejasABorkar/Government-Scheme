# ============================================
# DATABASE (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/pqr?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================
# JWT
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-seconds=900

# ============================================
# FLYWAY
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================
# SWAGGER
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.govermentscheme.backend=DEBUG
logging.level.org.springframework.security=INFO

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info

# ============================================
# SECURITY (default user disable)
# ============================================
spring.security.user.name=dummy
spring.security.user.password=dummy

# ============================================
# JACKSON
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata