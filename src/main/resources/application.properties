# DATABASE (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/xyz?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
